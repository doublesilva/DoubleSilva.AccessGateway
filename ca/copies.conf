# Inventário das cópias da raiz PÚBLICA da CA interna (T07.5). Lido por scripts/ca-copies-check.sh (somente leitura).
# Formato: caminho|papel|consumidores
#   papel: oficial (PKI da Green, fonte da verdade) | publicada (cert.home) | copia (mantida para consumidores)
#          | blue (PKI da Blue, até a remoção) | orfa (sem consumidor conhecido)
# Diretórios usados como SSL_CERT_DIR precisam do link de hash OpenSSL (<hash>.0) apontando para a cópia: papel "copia+hash".
/srv/accessgateway/data/caddy/caddy/pki/authorities/local/root.crt|oficial|accessgateway-caddy (emite as folhas); publish-public-ca.sh
/srv/accessgateway/shared/public-certs/caddy-root.crt|publicada|http://cert.home/caddy-root.crt (dispositivos)
/etc/accessgateway/ca/caddy-root.crt|copia|caminho canônico (T07.5.1, mantido por ca-distribute.sh); Kuma a partir da T07.5.2
/etc/homeautomation/certs/caddy-local-root.crt|copia|homeautomation-api/panel/outhome (bind de arquivo → update-ca-certificates); backup-home-server (KUMA_CACERT); home-smoke-test (CA_ROOT); home-smoke-publish (KUMA_CA_FILE); scripts do AccessGateway (CA_PUBLIC)
/etc/jarvis/certs/caddy-local-root.crt|copia+hash|jarvis-api (bind de diretório em /run/certs; SSL_CERT_DIR=/etc/ssl/certs:/run/certs)
/opt/caddy/data/caddy/pki/authorities/local/root.crt|blue|caddy (Blue, parado); uptime-kuma (bind de arquivo → NODE_EXTRA_CA_CERTS)
/home/diego/caddy-root.crt|orfa|nenhum conhecido (cópia manual de 18/09)
