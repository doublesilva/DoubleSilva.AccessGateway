# Drop-in para /etc/systemd/system/home-server-backup.service.d/10-retentativas.conf
# Limita as retentativas: no máximo 4 inícios em 6 h (12:30, 13:00, 13:30 e 14:00 a partir do timer diário).
# Antes: Restart=on-failure a cada 30 min sem limite (até 48 execuções por dia).
# O timer (home-server-backup.timer) não é alterado.
[Unit]
StartLimitIntervalSec=6h
StartLimitBurst=4

[Service]
Restart=on-failure
RestartSec=30min
# O backup não deve competir com os serviços: prioridade baixa de CPU e E/S.
Nice=10
IOSchedulingClass=idle
TimeoutStartSec=3h
