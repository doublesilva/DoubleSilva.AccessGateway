# AccessGateway — Authelia (Green) com backend LDAP (LLDAP). PREPARADO para o cutover (T09.3.7); NÃO usado pela
# Green atual, que continua com authelia/configuration.yml (backend file).
#
# Igual a authelia/configuration.yml em tudo, exceto o bloco authentication_backend (garantido por
# tests/tools/authelia_ldap_parity.py): OIDC, controle de acesso, sessão, storage e segundo fator ficam idênticos.
# Usado só com compose.lldap.yml (--profile lldap), que monta este arquivo em /config/configuration.yml, injeta a
# senha da conta de serviço por arquivo e faz o Authelia esperar o LLDAP saudável.
# Requer X_AUTHELIA_CONFIG_FILTERS=template. Nenhum segredo neste arquivo.

theme: auto

server:
  address: 'tcp://0.0.0.0:9091/'

log:
  level: info

authentication_backend:
  password_reset:
    disable: true

  # Grupos e desativação valem na próxima requisição de cada sessão (T09.3.4). Custo: uma consulta LDAP por
  # requisição protegida, limitada pelo timeout abaixo quando o LLDAP não responde (T09.3.7).
  refresh_interval: 'always'

  ldap:
    implementation: 'lldap'
    address: 'ldap://lldap:3890'
    # Padrão 5s. Medido na T09.3.7: operações normais levam milissegundos; com o LLDAP congelado, o timeout é o
    # tempo de espera de cada requisição protegida.
    timeout: '2s'
    base_dn: 'dc=home,dc=doublesilva,dc=com'
    # O LLDAP não tem atributo de conta desativada: desativar = entrar no grupo gateway-disabled.
    users_filter: '(&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person)(!(memberOf=cn=gateway-disabled,ou=groups,dc=home,dc=doublesilva,dc=com)))'
    # Conta de serviço em lldap_password_manager (troca nativa de senha por Password Modify, T09.3.4).
    # Senha: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE=/secrets/LDAP_PASSWORD (compose.lldap.yml).
    user: 'uid=authelia,ou=people,dc=home,dc=doublesilva,dc=com'

access_control:
  default_policy: deny

  rules:
    - domain:
        - 'admin.home.doublesilva.com'
        - 'kuma.home.doublesilva.com'
        - 'netdata.home.doublesilva.com'
        - 'adguard.home.doublesilva.com'
        - 'portainer.home.doublesilva.com'
        - 'jarvis.home.doublesilva.com'
      subject:
        - 'group:home-admin'
      policy: one_factor

    - domain:
        - 'panel.home.doublesilva.com'
        - 'frigate.home.doublesilva.com'
      subject:
        - 'group:home-admin'
        - 'group:home-user'
      policy: one_factor

session:
  name: authelia_session

  cookies:
    - domain: 'home.doublesilva.com'
      authelia_url: 'https://auth.home.doublesilva.com'
      default_redirection_url: 'https://admin.home.doublesilva.com'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'

identity_providers:
  oidc:
    hmac_secret: '{{ secret "/secrets/oidc/hmac_secret" }}'

    jwks:
      - algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/oidc/jwks-rsa.key" | mindent 10 "|" | msquote }}

    claims_policies:
      homeautomation:
        access_token:
          - 'groups'

    clients:
      - client_id: 'homeautomation-panel'
        client_name: 'Home Automation Panel'
        client_secret: '{{ secret "/secrets/oidc/clients/homeautomation-panel.digest" }}'

        public: false

        authorization_policy: 'one_factor'

        redirect_uris:
          - 'https://panel.home.doublesilva.com/signin-oidc'

        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'

        grant_types:
          - 'authorization_code'

        response_types:
          - 'code'

        response_modes:
          - 'form_post'
          - 'query'

        token_endpoint_auth_method: 'client_secret_post'
        pushed_authorization_request_endpoint_auth_method: 'client_secret_post'

        require_pkce: true
        pkce_challenge_method: 'S256'

        claims_policy: 'homeautomation'

        audience:
          - 'homeautomation-api'

        requested_audience_mode: 'implicit'

        access_token_signed_response_alg: 'RS256'

        id_token_signed_response_alg: 'RS256'

        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'

      - client_id: 'homeautomation-outhome'
        client_name: 'Home Automation OutHome'
        client_secret: '{{ secret "/secrets/oidc/clients/homeautomation-outhome.digest" }}'

        public: false
        authorization_policy: 'one_factor'

        redirect_uris:
          - 'https://casa.home/signin-oidc'

        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'

        grant_types:
          - 'authorization_code'

        response_types:
          - 'code'

        response_modes:
          - 'form_post'
          - 'query'

        token_endpoint_auth_method: 'client_secret_post'
        pushed_authorization_request_endpoint_auth_method: 'client_secret_post'

        require_pkce: true
        pkce_challenge_method: 'S256'

        claims_policy: 'homeautomation'

        audience:
          - 'homeautomation-api'

        requested_audience_mode: 'implicit'

        access_token_signed_response_alg: 'RS256'
        id_token_signed_response_alg: 'RS256'

        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'

      - client_id: 'jarvis-home'
        client_name: 'Jarvis Home'
        client_secret: '{{ secret "/secrets/oidc/clients/jarvis-home.digest" }}'
        public: false
        scopes:
          - 'homeautomation.mcp.read'
        audience:
          - 'homeautomation-api'
        grant_types:
          - 'client_credentials'
        requested_audience_mode: 'explicit'
        access_token_signed_response_alg: 'RS256'
        token_endpoint_auth_method: 'client_secret_basic'

      - client_id: 'saldo360'
        client_name: 'Saldo360'
        # Digest do segredo exclusivo (texto puro só na API do Saldo360).
        client_secret: '{{ secret "/secrets/oidc/clients/saldo360.digest" }}'
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        # Somente desenvolvimento por enquanto; callback de produção pendente.
        redirect_uris:
          - 'http://localhost:5173/signin-oidc'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        response_modes:
          - 'query'
        token_endpoint_auth_method: 'client_secret_post'
        pushed_authorization_request_endpoint_auth_method: 'client_secret_post'
        userinfo_signed_response_alg: 'none'
